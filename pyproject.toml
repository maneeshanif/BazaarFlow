[project]
name = "bazaarflow"
version = "3.0.0"
description = "BazaarFlow - WhatsApp multi-tenant AI sales platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # -- Web framework ---------------------------------------------------------
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # -- Database (SQLAlchemy 2.0 async + Supabase PostgreSQL) -----------------
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    # -- Settings & Validation -------------------------------------------------
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # -- AI / Agents -----------------------------------------------------------
    "openai-agents>=0.4.1",
    "openai>=1.30.0",
    # -- WhatsApp / Meta -------------------------------------------------------
    "pywa[fastapi]>=3.4.0",
    # -- MCP Tools -------------------------------------------------------------
    "fastmcp>=2.13.0",
    # -- HTTP & Utilities ------------------------------------------------------
    "requests>=2.32.3",
    "pyjwt>=2.15.1",
    "passlib[bcrypt]>=1.7.4",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "psycopg2-binary>=2.9.13",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agent_service"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not pg'"
# a stuck test fails loudly instead of stalling the whole run (the real-Postgres tests need the headroom)
timeout = 300
markers = [
    "pg: needs Docker (real Postgres via testcontainers); run with -m pg, verify.sh runs them when Docker is up",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "backend", "frontend", ".claude", ".codex", ".gemini", ".cursor", ".agent",
    "skills", "scripts", "docs", "context", "alembic/versions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S608"]
ignore = ["E501", "B008", "B904", "B007", "B905"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
exclude = ['^backend/', '^frontend/', '^[.]claude/', '^[.]codex/', '^[.]gemini/', '^[.]cursor/', '^[.]agent/', '^skills/', '^scripts/', '^docs/', '^alembic/versions/', '^[.]venv/']

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["E402", "S608"]
"app/agents/**" = ["E402"]
"app/services/**" = ["E402"]
"app/integrations/**" = ["E402"]
"app/repositories/**" = ["E402"]
[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true  # asyncpg ships no type stubs
