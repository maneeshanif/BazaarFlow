version: "3.9"

services:

  # -- FastAPI Backend ----------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: bazaarflow_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-v17.0}
      - META_GRAPH_BASE=${META_GRAPH_BASE:-https://graph.facebook.com}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID}
      - FACEBOOK_ACCESS_TOKEN=${FACEBOOK_ACCESS_TOKEN}
      - VAPI_API_KEY=${VAPI_API_KEY}
      - VAPI_WEBHOOK_SECRET=${VAPI_WEBHOOK_SECRET}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
      - MARKETING_SCHEDULER_ENABLED=${MARKETING_SCHEDULER_ENABLED:-true}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - bazaarflow_net

  # -- Agent service (ADR 0003): no env_file and no database variable, on purpose -----------
  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    container_name: bazaarflow_agent
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - APP_ENV=production
      - AGENT_SERVICE_TOKEN=${AGENT_SERVICE_TOKEN}
      - API_BASE_URL=http://backend:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bazaarflow_net

  # -- Next.js Frontend ---------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_VAPI_PUBLIC_KEY: ${NEXT_PUBLIC_VAPI_PUBLIC_KEY}
        NEXT_PUBLIC_VAPI_SUPPORT_ASSISTANT_ID: ${NEXT_PUBLIC_VAPI_SUPPORT_ASSISTANT_ID}
    container_name: bazaarflow_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    networks:
      - bazaarflow_net

networks:
  bazaarflow_net:
    driver: bridge
