name: web

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/web.yml"
      - "scripts/verify.sh"

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for the responsive e2e check
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify
        run: bash scripts/verify.sh --lane web
