name: deploy

# Production deploy: runs on every merge to main, or by hand (Actions -> deploy -> Run workflow).
# Order matters: schema first (migrator role), then the API on FastAPI Cloud, then the web app on Vercel.
# Credentials are GitHub secrets only: DATABASE_URL_MIGRATIONS, FASTAPI_CLOUD_TOKEN, FASTAPI_CLOUD_APP_ID,
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: All checks (api, api-db, web, infra)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium for the responsive e2e check
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash scripts/verify.sh --lane api --lane api-db --lane web --lane infra

  api:
    name: Migrate and deploy the API
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: uv sync --frozen
      - name: Apply database migrations (migrator role)
        env:
          DATABASE_URL_MIGRATIONS: ${{ secrets.DATABASE_URL_MIGRATIONS }}
        run: uv run alembic upgrade head
      - name: Deploy the API to FastAPI Cloud
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
        run: uv run fastapi deploy

  web:
    name: Deploy the web app
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: api
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull Vercel settings
        run: npx --yes vercel@62.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes vercel@62.2.0 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: npx --yes vercel@62.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
