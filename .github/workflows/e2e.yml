name: e2e

# Full-stack Playwright run. Slow, and only catches whole-stack bugs, so it is OFF the
# default PR path. It runs:
#   - on PRs labelled `run-e2e` (use it for auth / session / API startup / BFF work)
#   - on every push to main (gate any image publish on this job)
#   - nightly and on manual dispatch
on:
  # push-to-main and nightly triggers are enabled once Playwright (`npm run test:e2e`) exists in frontend/
  pull_request:
    branches: [main]
    # `labeled` so adding `run-e2e` to an open PR starts the job.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E tests (Playwright, full stack)
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend

      - name: Prepare CI-only environment
        run: |
          cp .env.example .env
          echo "JWT_SECRET_KEY=ci-only-$(openssl rand -hex 16)" >> .env

      - name: Build and start the stack
        working-directory: .
        run: docker compose up -d --build

      - name: Wait for the stack to become healthy
        run: |
          set -euo pipefail
          for url in http://localhost:8000/health http://localhost:3000; do
            ok=0
            for _ in $(seq 1 30); do
              if curl -sf "$url" > /dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then echo "::error::$url did not become healthy in time."; exit 1; fi
          done

      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Run Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: "true"
        run: npm run test:e2e

      - name: Show container logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v
