name: infra

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "backend.Dockerfile"
      - "frontend/Dockerfile"
      - ".github/**"
      - ".github/workflows/infra.yml"
      - "scripts/verify.sh"
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "backend.Dockerfile"
      - "frontend/Dockerfile"
      - ".github/**"
      - ".github/workflows/infra.yml"
      - "scripts/verify.sh"

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify.sh --lane infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify
        run: bash scripts/verify.sh --lane infra
