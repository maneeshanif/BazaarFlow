name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Workflow syntax, expressions, permissions and embedded shell — the class
  # of failure that otherwise needs a push to discover. Local equivalent:
  # scripts/verify.sh's infra lane.
  workflow-lint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installs and runs the gitleaks CLI directly rather than
      # gitleaks/gitleaks-action, which calls the GitHub API to post a PR
      # comment/summary and fails with "Resource not accessible by
      # integration" whenever the token doesn't have write access — always
      # true for PRs from forks, and not something this workflow should grant
      # (that needs contents/pull-requests write, which a `pull_request`
      # workflow can't safely have — see the `pull_request_target` warning
      # in GitHub's own docs). The CLI has no such API dependency.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose
